<dialog id="content-path-dialog" aria-labelledby="content-path-title">
  <div class="dialog-top"><h2 id="content-path-title">{{findPath}}</h2><button class="icon-button" type="button" data-close-dialog aria-label="{{closePath}}"><span data-icon="close"></span></button></div>
  <p class="muted">{{dialogPathDescription}}</p>
  <form id="content-path-form">
    <div class="path-fields">
      <label for="content-path-from">{{from}}</label><input id="content-path-from" list="content-group-names" value="{{defaultFrom}}" autocomplete="off" required>
      <span class="field-connector" aria-hidden="true"></span>
      <label for="content-path-to">{{to}}</label><input id="content-path-to" list="content-group-names" value="aespa" autocomplete="off" required>
    </div>
    <datalist id="content-group-names"></datalist>
    <label class="check"><input id="content-path-expanded" type="checkbox"><span>{{expanded}}</span></label>
    <button class="primary" type="submit">{{findPath}} <span data-icon="arrow"></span></button>
  </form>
  <p id="content-path-status" class="muted" role="status"></p>
  <div id="content-path-result" aria-live="polite"></div>
</dialog>
