<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eff7f8">
__SEO_HEAD__
<style>__CSS__</style>
</head>
<body>
<header>
 <a class="brand" href="{{homePath}}" id="home" aria-label="{{homeLabel}}"><span class="brand-mark" aria-hidden="true"><i></i><i></i></span><span>{{brand}}</span></a>
 <nav aria-label="{{mainMenu}}"><button id="nav-map" class="nav-item active" aria-current="page">{{map}}</button><a class="nav-item" href="{{groupsPath}}">{{groups}}</a><button id="nav-path" class="nav-item">{{findPath}}</button><button id="about" class="nav-item">{{about}}</button></nav>
 <div class="search-wrap"><label class="sr-only" for="search">{{searchLabel}}</label><span data-icon="search" class="search-icon"></span><input id="search" type="search" placeholder="{{searchPlaceholder}}" autocomplete="off" aria-controls="results" aria-expanded="false"><kbd>/</kbd><div id="results" class="results" hidden></div></div>
 __LANGUAGE_LINK__
 __GITHUB_LINK__
 <button id="inspector-toggle" class="icon-button mobile-only" aria-label="{{openInspector}}" aria-expanded="false"><span data-icon="sliders"></span></button>
</header>
<main>
 <section class="workspace" aria-label="{{mapRegion}}">
  <div class="map-toolbar"><div class="map-heading"><h1 id="map-title">{{mapTitle}}</h1></div><button id="reset" class="reset-button" aria-label="{{reset}}"><span data-icon="reset"></span><span>{{reset}}</span></button></div>
  <div id="graph" role="group" aria-label="{{mapDescription}}"></div>
  <div id="error" class="error" role="alert" hidden></div>
  <div class="map-controls" role="group" aria-label="{{mapControls}}"><button id="zoom-in" aria-label="{{zoomIn}}"><span data-icon="plus"></span></button><button id="zoom-out" aria-label="{{zoomOut}}"><span data-icon="minus"></span></button></div>

 </section>
 <aside id="inspector" aria-label="{{inspector}}">
  <div class="panel-top"><span>{{browse}}</span><button class="icon-button mobile-only" id="close-inspector" aria-label="{{closeInspector}}"><span data-icon="close"></span></button><span class="panel-counter" id="scope-count"></span></div>
  <div class="scope">
   <div class="component-picker"><input id="component" type="hidden" value="all"><button id="component-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="component-menu"><span id="component-label">{{allClusters}}</span><span data-icon="chevron"></span></button><div id="component-menu" role="listbox" aria-label="{{clusters}}" hidden></div></div>
   <details class="scope-options"><summary><span data-icon="sliders"></span>{{scope}}</summary><label class="check"><input type="checkbox" id="isolates"><span>{{showUnlinked}} <em id="isolate-count"></em></span></label><label class="check"><input type="checkbox" id="expanded"><span>{{expanded}}</span></label><p>{{scopeNote}}</p><button id="about-scope" class="scope-about" type="button">{{about}}</button></details>
  </div>
  <div class="tabs" role="tablist" aria-label="{{navigationMode}}"><button id="tab-group" class="active" role="tab" aria-selected="true" aria-controls="group-panel"><span data-icon="map"></span>{{groupSection}}</button><button id="tab-path" role="tab" aria-selected="false" aria-controls="path-panel"><span data-icon="route"></span>{{path}}</button></div>
  <div class="inspector-content">
   <section id="group-panel" role="tabpanel" aria-labelledby="tab-group"><div id="details"></div></section>
   <section id="path-panel" role="tabpanel" aria-labelledby="tab-path" hidden>
    <h2>{{pathHeading}}</h2><p class="muted">{{pathDescription}}</p>
    <form id="path-form"><div class="path-fields"><label for="path-from">{{from}}</label><input id="path-from" list="group-names" value="{{defaultFrom}}" autocomplete="off"><span class="field-connector" aria-hidden="true"></span><label for="path-to">{{to}}</label><input id="path-to" list="group-names" value="aespa" autocomplete="off"></div><datalist id="group-names"></datalist><button class="primary" type="submit">{{findPath}} <span data-icon="arrow"></span></button></form>
    <div id="path-result" aria-live="polite"></div>
   </section>
  </div>

 </aside>
</main>
__ABOUT_DIALOG__
<script>__JS__</script>
</body></html>
