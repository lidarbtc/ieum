<h2 id="about-title">같은 멤버로 이어진 그룹들</h2>
<p>한 사람이 두 그룹에서 활동했다면, 두 그룹을 선으로 이었어요.</p>
<p>권은비는 예아, IZ*ONE, Feverse에서 활동했어요. 그래서 이 세 그룹은 서로 연결돼요.</p>
<p>점을 누르면 누구 때문에 연결됐는지 볼 수 있어요. ‘경로 찾기’에서는 두 그룹이 어떤 멤버를 거쳐 이어지는지 보여줘요.</p>
